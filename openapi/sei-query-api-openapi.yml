                      name:
                        type: string
                        description: 'Since: cosmos-sdk 0.43'
                        title: 'name defines the name of the token (eg: Cosmos Atom)'
                      symbol:
                        type: string
                        description: 'symbol is the token symbol usually shown on exchanges (eg: ATOM). This can

                          be the same as the display.


